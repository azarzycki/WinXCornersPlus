name: UI tests

# Windows-only UI tests: real windows, real message loops, screenshots of every window in light and dark mode.
on:
  push:
    branches: [master, 'hardening/**']
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run the UI tests as a gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  ui:
    name: UI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm: the free hosted Windows 11 ARM64 runner, the closest to what users run (the others are Windows Server).
        os: [windows-2022, windows-2025, windows-11-arm]
    env:
      UI_SCREENSHOT_DIR: ${{ github.workspace }}\TestResults\screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The hosted runners start at 1024x768, too small for the Settings window at a simulated 200% scale; a larger
      # desktop is tried (best effort). Other windows (the runner's consoles) are minimized so that the screen copies
      # show only the window under test.
      - name: Prepare the desktop
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class Display {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static int Set(int width, int height) {
              var dm = new DEVMODE();
              dm.dmSize = (short)Marshal.SizeOf(dm);
              if (!EnumDisplaySettings(null, -1, ref dm)) return -100;
              dm.dmPelsWidth = width; dm.dmPelsHeight = height; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          "@
          foreach ($size in @(@(1920, 1080), @(1600, 1200), @(1280, 1024))) {
            $result = [Display]::Set($size[0], $size[1])
            "ChangeDisplaySettings $($size[0])x$($size[1]): $result"
            if ($result -eq 0) { break }
          }
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 2

      - name: Show OS build, session and screen
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version) build $([Environment]::OSVersion.Version.Build)"
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)  interactive: $([Environment]::UserInteractive)  user: $env:USERNAME"
          Add-Type -AssemblyName System.Windows.Forms
          foreach ($s in [System.Windows.Forms.Screen]::AllScreens) {
            "Screen: $($s.DeviceName) bounds $($s.Bounds) working area $($s.WorkingArea) primary $($s.Primary)"
          }
          $theme = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -ErrorAction SilentlyContinue
          "AppsUseLightTheme: $($theme.AppsUseLightTheme)"

      - name: Build
        run: dotnet build tests/WinXCorners.App.UiTests/WinXCorners.App.UiTests.csproj -c Release

      - name: Test
        run: >
          dotnet test tests/WinXCorners.App.UiTests/WinXCorners.App.UiTests.csproj -c Release --no-build
          --results-directory TestResults --logger "trx;LogFileName=ui.trx"
          --logger "console;verbosity=normal" --blame-hang-timeout 10m

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Recurse -Filter *.trx | Select-Object -First 1
          if (-not $trx) { "## UI tests (${{ matrix.os }})`n`nNo test results were produced." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          [xml]$xml = Get-Content $trx.FullName
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $results = Select-Xml -Xml $xml -XPath '//t:UnitTestResult' -Namespace $ns | ForEach-Object { $_.Node }
          $passed = @($results | Where-Object outcome -eq 'Passed').Count
          $failed = @($results | Where-Object outcome -eq 'Failed').Count
          $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' }).Count
          $shots = @(Get-ChildItem TestResults/screenshots -Filter *.png -ErrorAction SilentlyContinue).Count
          $lines = @("## UI tests (${{ matrix.os }})", "", "| Passed | Failed | Skipped | Screenshots |", "|---|---|---|---|", "| $passed | $failed | $skipped | $shots |", "")
          foreach ($r in $results | Where-Object { $_.outcome -eq 'NotExecuted' }) {
            $reason = ($r.Output.StdOut, $r.Output.ErrorInfo.Message | Where-Object { $_ }) -join ' '
            $lines += "- Skipped: $($r.testName) - $reason"
          }
          foreach ($r in $results | Where-Object outcome -eq 'Failed') {
            $lines += "- Failed: $($r.testName)"
          }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
