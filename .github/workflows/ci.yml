name: CI

on:
  push:
    branches: [master, 'hardening/**']
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run this whole pipeline as its gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Inside a called workflow github.workflow is the caller's name, so the standalone run and the release gate's
  # copy of this workflow do not cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: >
          dotnet test tests/WinXCorners.Core.Tests/WinXCorners.Core.Tests.csproj
          --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings
          --results-directory TestResults --logger "trx;LogFileName=core.trx"
      - name: Coverage gate
        shell: pwsh
        run: ./build/Check-Coverage.ps1 -ResultsDirectory TestResults -MinimumLine 95 -MinimumBranch 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn

  app-tests:
    name: Windows app tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Windows version
        shell: pwsh
        run: |
          $v = [Environment]::OSVersion.Version
          $elevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole('Administrators')
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          Write-Host "Windows build $($v.Build) ($v); process architecture: $arch; administrator: $elevated"
      - name: Build app (Release, warnings are errors)
        run: dotnet build src/WinXCorners.App/WinXCorners.App.csproj -c Release -warnaserror
      - name: Test
        run: >
          dotnet test tests/WinXCorners.App.Tests/WinXCorners.App.Tests.csproj -c Release -warnaserror
          --collect:"XPlat Code Coverage" --settings tests/WinXCorners.App.Tests/coverage.runsettings
          --results-directory TestResults --logger "trx;LogFileName=app.trx"
          --logger "console;verbosity=normal" --blame-hang-timeout 5m
      - name: Summary
        if: always()
        shell: pwsh
        run: ./build/Write-TestSummary.ps1 -ResultsDirectory TestResults -Title 'Windows app tests (${{ matrix.os }})'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
